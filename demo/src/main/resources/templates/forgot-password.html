<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘記密碼 - 員工系統</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body class="center">
  <main class="card login">
    <h1>忘記密碼</h1>
    <p class="hint">輸入你的帳號與系統登記的 Email，我們會寄一組新密碼給你。</p>
    <form th:object="${form}" th:action="@{/forgot-password}" method="post">
      <ul class="errors" th:if="${#fields.hasErrors('*')}">
        <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.message}">錯誤</li>
      </ul>
      <p class="msg ok" th:if="${done}">
        如果帳號與 Email 相符，新密碼已寄出，請到信箱查收。10 分鐘內只能申請一次；
        若一直收不到，請確認垃圾信件匣，或依下方說明聯絡管理員。
      </p>
      <label for="username">帳號</label>
      <input th:field="*{username}" autocomplete="username" required>
      <label for="email">Email</label>
      <input type="email" th:field="*{email}" autocomplete="email" required>
      <button type="submit">寄送新密碼</button>
    </form>
    <p class="hint">
      沒有登記 Email、Email 已更換或記不得登記的是哪一個信箱時，無法自行重設，
      請聯絡管理員，管理員可以在「員工管理」直接為你設定新密碼。
    </p>
    <p class="hint"><a th:href="@{/login}">回登入頁</a></p>
  </main>
</body>
</html>
