<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出勤總覽 - 員工系統</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
  <header th:replace="~{fragments/nav :: bar}"></header>

  <main class="wrap">
    <section class="card">
      <h2>今日出勤（<span th:text="${#temporals.format(#temporals.createToday(), 'yyyy/MM/dd')}">2026/01/01</span>）</h2>
      <p class="empty" th:if="${#lists.isEmpty(records)}">今天還沒有人打卡。</p>
      <div class="table-scroll" th:unless="${#lists.isEmpty(records)}">
        <table>
          <thead><tr><th>員工編號</th><th>姓名</th><th>上班</th><th>下班</th></tr></thead>
          <tbody>
            <tr th:each="r : ${records}">
              <td th:text="${r.employee.employeeNo != null} ? ${r.employee.employeeNo} : '-'">EMP20260001</td>
              <td th:text="${r.employee.name}">王小明</td>
              <td th:text="${#temporals.format(r.clockIn, 'HH:mm:ss')}">09:00:00</td>
              <td th:text="${r.clockOut != null} ? ${#temporals.format(r.clockOut, 'HH:mm:ss')} : '-'">-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
