<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>補打卡 - 員工系統</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
  <link rel="stylesheet" th:href="@{/css/leave.css}">
</head>
<body>
  <header th:replace="~{fragments/nav :: bar}"></header>

  <main class="wrap wide">
    <p class="msg ok" th:if="${message}" th:text="${message}"></p>
    <p class="msg error" th:if="${error}" th:text="${error}"></p>

    <section class="card">
      <h2>申請補打卡</h2>
      <form th:object="${form}" th:action="@{/front/makeup}" method="post">
        <ul class="errors" th:if="${#fields.hasErrors('*')}">
          <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.message}">錯誤</li>
        </ul>
        <div class="grid2">
          <div><label for="workDate">日期</label><input type="date" th:field="*{workDate}" required></div>
          <div><label for="clockIn">上班時間</label><input type="time" th:field="*{clockIn}"></div>
          <div><label for="clockOut">下班時間</label><input type="time" th:field="*{clockOut}"></div>
        </div>
        <label for="reason">事由</label>
        <input th:field="*{reason}" maxlength="200" required>
        <p class="hint">
          忘記打哪一個就填哪一個時間，兩個都漏打就都填。只能補最近 <span th:text="${maxDays}">31</span> 天內的上班日，
          送出後由直屬主管（沒有主管則由管理員）審核，核准後才會寫入打卡紀錄。
        </p>
        <div class="form-actions"><button type="submit">送出申請</button></div>
      </form>
    </section>

    <section class="card">
      <h2>我的補打卡紀錄</h2>
      <p class="empty" th:if="${#lists.isEmpty(requests)}">還沒有補打卡紀錄。</p>
      <div class="table-scroll" th:unless="${#lists.isEmpty(requests)}">
        <table>
          <thead>
            <tr><th>日期</th><th>上班</th><th>下班</th><th>事由</th><th>狀態</th><th>審核人</th><th>意見／註銷原因</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="r : ${requests}">
              <td th:text="${r.workDate}">2026-11-12</td>
              <td th:text="${r.clockInTime != null} ? ${#temporals.format(r.clockInTime, 'HH:mm')} : '-'">08:30</td>
              <td th:text="${r.clockOutTime != null} ? ${#temporals.format(r.clockOutTime, 'HH:mm')} : '-'">17:30</td>
              <td class="wrap-text" th:text="${r.reason}">事由</td>
              <td><span class="badge" th:classappend="${'s-' + r.status.name().toLowerCase()}" th:text="${r.status.label}">審核中</span></td>
              <td th:text="${r.decidedBy != null} ? ${r.decidedBy.name} : '-'">-</td>
              <td class="wrap-text"
                  th:text="${r.voidReason != null} ? ${'註銷：' + r.voidReason} : (${r.decisionComment != null} ? ${r.decisionComment} : '-')">-</td>
              <td>
                <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/front/makeup/{id}/cancel(id=${r.id})}" method="post">
                  <button type="submit" class="secondary">取消</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
