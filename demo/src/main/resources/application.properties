spring.application.name=demo

# PostgreSQL（請改成你自己的資料庫、帳號、密碼）
spring.datasource.url=jdbc:postgresql://localhost:5432/staff_db
spring.datasource.username=postgres
spring.datasource.password=iu0516

# 開發階段：啟動時自動建立／更新資料表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 信箱伺服器設定(模擬)
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=noreply@staff.local

# ---- 政府行政機關辦公日曆表（國定假日） ----
# CSV 下載網址（逗號分隔可放多個）。預設用政府資料開放平臺上的「政府行政機關辦公日曆表(2018-2027)」。
# 若下載失敗，請到 https://data.gov.tw/dataset/14718 下載 CSV，再用後台「辦公日曆/颱風假」頁面上傳。
app.calendar.source-urls=https://data.ntpc.gov.tw/api/datasets/308dcd75-6434-45bc-a95f-584da4fed251/csv/file
# 啟動時（當年度沒資料）與每週一凌晨 3 點自動同步
app.calendar.auto-sync=true
app.calendar.sync-cron=0 0 3 * * MON
